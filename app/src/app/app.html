<header class="border-b border-line bg-surface">
  <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-x-6 gap-y-2 px-4 py-3">
    <a routerLink="/" class="font-mono text-sm font-semibold">{{ site.name }}</a>
    <nav aria-label="Principal" class="flex flex-wrap gap-1">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-fg text-bg"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="rounded-md px-3 py-1.5 text-sm font-medium text-muted hover:text-fg"
        >
          {{ link.label }}
        </a>
      }
    </nav>
  </div>
</header>

<main class="mx-auto max-w-5xl px-4">
  <router-outlet />
</main>

<footer class="mt-8 border-t border-line">
  <div class="mx-auto flex max-w-5xl flex-col gap-1 px-4 py-6 text-sm text-muted">
    <p>
      Demo del curso de Terraform ·
      <a
        [href]="site.repoUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="underline underline-offset-2 hover:text-fg"
      >
        código en GitHub
      </a>
    </p>
    <p>Íconos de servicios: AWS Architecture Icons. © {{ year }}</p>
  </div>
</footer>
